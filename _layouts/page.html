---
layout: default
---
<div class="wrap">
  <div class="hero" style="padding-top:2.5rem;">
    <span class="eyebrow">{{ page.eyebrow | default: "" }}</span>
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="muted" style="max-width:60ch;">{{ page.subtitle }}</p>{% endif %}
  </div>
  <div class="prose">
    {{ content }}
  </div>
</div>
