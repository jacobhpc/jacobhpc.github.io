---
layout: default
---
<div class="wrap">
  <div class="hero" style="padding-top:2.5rem;">
    <span class="eyebrow mono">{{ page.date | date: "%d %b %Y" }}{% if page.tags %} · {{ page.tags | join: ", " }}{% endif %}</span>
    <h1>{{ page.title }}</h1>
    {% if page.excerpt and page.description == nil %}{% endif %}
  </div>
  <article class="prose">
    {{ content }}
  </article>
  <p style="margin-top:3rem;"><a class="btn" href="{{ '/blog/' | relative_url }}">&larr; Back to all posts</a></p>
</div>
