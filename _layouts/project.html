---
layout: default
---
<div class="wrap">
  <div class="hero" style="padding-top:2.5rem;">
    <span class="eyebrow mono">{{ page.status | default: "Project" }}</span>
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="muted">{{ page.subtitle }}</p>{% endif %}
    {% if page.link %}<p><a class="btn accent" href="{{ page.link }}" target="_blank" rel="noopener">View project &rarr;</a></p>{% endif %}
  </div>
  <article class="prose">
    {{ content }}
  </article>
  <p style="margin-top:3rem;"><a class="btn" href="{{ '/projects/' | relative_url }}">&larr; Back to all projects</a></p>
</div>
