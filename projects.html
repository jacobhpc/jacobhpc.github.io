<div class="project-grid">
  {% for project in site.projects %}
  <a class="project-card" href="{{ project.url | relative_url }}" style="text-decoration:none; display:block;">
    <span class="status mono">{{ project.status | default: "Project" }}</span>
    <h3>{{ project.title }}</h3>
    <p class="muted" style="font-size:.92rem;">{{ project.subtitle }}</p>
  </a>
  {% endfor %}
</div>
